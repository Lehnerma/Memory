<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- !import an favicon -->
    <link rel="shortcut icon" href="" type="image/x-icon" />
    <title>Settings</title>
  </head>
  <body class="settings grid">
    <header>
      <h1 class="title">Settings</h1>
    </header>
    <main class="main">
      <section class="settings__options">
        <fieldset class="settings__field" id="field_themes">
          <legend class="settings__field--title">
            <img class="settings__field--icon" src="../public/assets/icons/palette.svg" alt="palette" />
            Game Themes
          </legend>
          <label class="settings__field--text"> <input type="radio" id="theme_code" name="theme" class="settings__field--radio-btn" value="coding"/> Code Vibes Theme </label>
          <label class="settings__field--text"> <input type="radio" id="theme_gaming" class="settings__field--radio-btn" name="theme" value="gaming"/> Gaming Theme </label>
          <label class="settings__field--text"> <input type="radio" id="theme_projects" class="settings__field--radio-btn" name="theme" value="projects"/> DA Projects Theme </label>
          <label class="settings__field--text"> <input type="radio" id="theme_food" class="settings__field--radio-btn" name="theme" value="food" /> Foods Theme </label>
        </fieldset>

        <fieldset class="settings__field">
          <legend class="settings__field--title">
            <img class="settings__field--icon" src="../public/assets/icons/chess_pawn.svg" alt="chess pawn" />
            Choose Player
          </legend>
          <label class="settings__field--text"> <input type="radio" id="" class="settings__field--radio-btn" name="player" /> Blue </label>
          <label class="settings__field--text"> <input type="radio" id="" class="settings__field--radio-btn" name="player" /> Orange </label>
        </fieldset>

        <fieldset class="settings__field">
          <legend class="settings__field--title">
            <img class="settings__field--icon" src="../public/assets/icons/card.svg" alt="card" />
            Board Size
          </legend>
          <label class="settings__field--text"> <input type="radio" id="" name="boardsize" class="settings__field--radio-btn" /> 16 Cards </label>
          <label class="settings__field--text"> <input type="radio" id="" name="boardsize" class="settings__field--radio-btn" /> 24 Cards </label>
          <label class="settings__field--text"> <input type="radio" id="" name="boardsize" class="settings__field--radio-btn" /> 36 Cards </label>
        </fieldset>
      </section>

      <section class="settings__preview">
        <figure class="img__figure">
          <img id="theme_preview" class="img__preview" src="../assets/img/themes/code-vibes/default.png" alt="Coding Theme" />
          <figcaption></figcaption>
        </figure>
        <aside class="summary">
          <p id="" class="summary--text">Game theme</p>
          <div class="summary--divider"></div>
          <p id="" class="summary--text">Player</p>
          <div class="summary--divider"></div>
          <p id="" class="summary--text">Board size</p>
          <button class="btn btn__start" disabled>
            <img id="" class="btn__start--icon" src="../public/assets/icons/smart_display.svg" alt="Start Button" />
            Start
          </button>
        </aside>
      </section>
    </main>
    <footer>
      <button id="test" style="height: 100px; width: 100px; margin-bottom: 200px;">Test</button>
    </footer>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
