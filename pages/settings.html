<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="public/assets/icons/memory.svg" type="image/x-icon" />

    <title>Settings</title>
  </head>
  <body class="settings grid">
    <header class="header">
      <section class="wrapper--header">
        <h1 class="title">Settings</h1>
        <svg class="svg__line" width="251" height="18" viewBox="0 0 251 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <polygon class="svg__line--diamond" points="250.6603,8.66028 242,0 233.3397,8.66028 242,17.3205" stroke="currentColor" stroke-width="1" />
          <line class="svg__line--stroke" x1="0" y1="8.66028" x2="242" y2="8.66028" stroke="currentColor" stroke-width="3" />
        </svg>
      </section>
    </header>
    <main class="main">
      <section class="settings__options">
        <fieldset class="settings__field" id="field_themes">
          <legend class="settings__field--title">
            <img class="settings__field--icon" src="../public/assets/icons/palette.svg" alt="palette" />
            Game Themes
          </legend>
          <div class="settings__field--options">
            <label class="radio">
              <input type="radio" id="theme_code" name="theme" class="radio__input" value="coding" data-label="Code Vibes Theme" />Code Vibes Theme
              <svg class="svg__line" viewBox="0 0 50 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon class="svg__line--diamond" points="49.6603,8.66028 41,0 32.3397,8.66028 41,17.3205" stroke="currentColor" stroke-width="1" />
                <line class="svg__line--stroke" x1="0" y1="8.66028" x2="41" y2="8.66028" stroke="currentColor" stroke-width="3" />
              </svg>
            </label>
            <label class="radio">
              <input type="radio" id="theme_gaming" class="radio__input" name="theme" value="gaming" data-label="Gaming Theme" />Gaming Theme
              <svg class="svg__line" viewBox="0 0 50 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon class="svg__line--diamond" points="49.6603,8.66028 41,0 32.3397,8.66028 41,17.3205" stroke="currentColor" stroke-width="1" />
                <line class="svg__line--stroke" x1="0" y1="8.66028" x2="41" y2="8.66028" stroke="currentColor" stroke-width="3" />
              </svg>
            </label>
            <label class="radio">
              <input type="radio" id="theme_projects" class="radio__input" name="theme" value="projects" data-label="Projects Theme" />Projects Theme
              <svg class="svg__line" viewBox="0 0 50 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon class="svg__line--diamond" points="49.6603,8.66028 41,0 32.3397,8.66028 41,17.3205" stroke="currentColor" stroke-width="1" />
                <line class="svg__line--stroke" x1="0" y1="8.66028" x2="41" y2="8.66028" stroke="currentColor" stroke-width="3" />
              </svg>
            </label>
            <label class="radio">
              <input type="radio" id="theme_food" class="radio__input" name="theme" value="food" data-label="Foods Theme" />Foods Theme
              <svg class="svg__line" viewBox="0 0 50 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon class="svg__line--diamond" points="49.6603,8.66028 41,0 32.3397,8.66028 41,17.3205" stroke="currentColor" stroke-width="1" />
                <line class="svg__line--stroke" x1="0" y1="8.66028" x2="41" y2="8.66028" stroke="currentColor" stroke-width="3" />
              </svg>
            </label>
          </div>
        </fieldset>

        <fieldset class="settings__field" id="field_player">
          <legend class="settings__field--title">
            <img class="settings__field--icon" src="../public/assets/icons/chess_pawn.svg" alt="chess pawn" />
            Choose Player
          </legend>
          <div class="settings__field--options">
            <label class="radio">
              <input type="radio" id="" class="radio__input" name="player" value="blue" data-label="Blue"/> Blue
              <svg class="svg__line" width="50" height="18" viewBox="0 0 50 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon class="svg__line--diamond" points="49.6603,8.66028 41,0 32.3397,8.66028 41,17.3205" stroke="currentColor" stroke-width="1" />
                <line class="svg__line--stroke" x1="0" y1="8.66028" x2="41" y2="8.66028" stroke="currentColor" stroke-width="3" />
              </svg>
            </label>
            <label class="radio">
              <input type="radio" id="" class="radio__input" name="player" value="orange" data-label="Orange" /> Orange
              <svg class="svg__line" width="50" height="18" viewBox="0 0 50 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon class="svg__line--diamond" points="49.6603,8.66028 41,0 32.3397,8.66028 41,17.3205" stroke="currentColor" stroke-width="1" />
                <line class="svg__line--stroke" x1="0" y1="8.66028" x2="41" y2="8.66028" stroke="currentColor" stroke-width="3" />
              </svg>
            </label>
          </div>
        </fieldset>

        <fieldset class="settings__field" id="field_boardsize">
          <legend class="settings__field--title">
            <img class="settings__field--icon" src="../public/assets/icons/card.svg" alt="card" />
            Board Size
          </legend>
          <div class="settings__field--options">
            <label class="radio">
              <input type="radio" id="" name="boardsize" class="radio__input" value="16" data-label="16 Cards" /> 16 Cards
              <svg class="svg__line" width="50" height="18" viewBox="0 0 50 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon class="svg__line--diamond" points="49.6603,8.66028 41,0 32.3397,8.66028 41,17.3205" stroke="currentColor" stroke-width="1" />
                <line class="svg__line--stroke" x1="0" y1="8.66028" x2="41" y2="8.66028" stroke="currentColor" stroke-width="3" />
              </svg>
            </label>
            <label class="radio">
              <input type="radio" id="" name="boardsize" class="radio__input" value="24" data-label="24 Cards" /> 24 Cards
              <svg class="svg__line" width="50" height="18" viewBox="0 0 50 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon class="svg__line--diamond" points="49.6603,8.66028 41,0 32.3397,8.66028 41,17.3205" stroke="currentColor" stroke-width="1" />
                <line class="svg__line--stroke" x1="0" y1="8.66028" x2="41" y2="8.66028" stroke="currentColor" stroke-width="3" />
              </svg>
            </label>
            <label class="radio">
              <input type="radio" id="" name="boardsize" class="radio__input" value="36" data-label="36 Cards" /> 36 Cards
              <svg class="svg__line" width="50" height="18" viewBox="0 0 50 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <polygon class="svg__line--diamond" points="49.6603,8.66028 41,0 32.3397,8.66028 41,17.3205" stroke="currentColor" stroke-width="1" />
                <line class="svg__line--stroke" x1="0" y1="8.66028" x2="41" y2="8.66028" stroke="currentColor" stroke-width="3" />
              </svg>
            </label>
          </div>
        </fieldset>
      </section>

      <section class="settings__preview">
        <figure class="img__figure">
          <img id="theme_preview" class="img__preview" src="../assets/img/themes/coding/default.png" alt="Coding Theme" />
          <figcaption></figcaption>
        </figure>
        <aside class="summary">
          <p id="summary_theme" class="summary--text">Game theme</p>
          <div class="summary--divider"></div>
          <p id="summary_player" class="summary--text">Player</p>
          <div class="summary--divider"></div>
          <p id="summary_boardsize" class="summary--text">Board size</p>
          <button class="btn btn__start" id="btn_start" disabled>
            <img id="" class="btn__start--icon" src="../public/assets/icons/smart_display.svg" alt="Start Button" />
            Start
          </button>
        </aside>
      </section>
    </main>
    <footer></footer>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
